name: Deploy LINX site to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy current main site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build safe static Pages artifact
        run: |
          rm -rf .pages-artifact
          mkdir .pages-artifact
          tar \
            --exclude-vcs \
            --exclude='./.pages-artifact' \
            --exclude='./node_modules' \
            --exclude='./admin/node_modules' \
            --exclude='./workers' \
            --exclude='./scripts' \
            --exclude='./docs' \
            --exclude='./.env*' \
            --exclude='*/.env*' \
            --exclude='./wrangler.jsonc' \
            --exclude='./package.json' \
            --exclude='./package-lock.json' \
            --exclude='./admin/package.json' \
            --exclude='./admin/package-lock.json' \
            --exclude='./admin/server.js' \
            --exclude='./admin/leads' \
            --exclude='./admin/src' \
            --exclude='./DEPLOY.md' \
            --exclude='./todo.md' \
            -cf - . | tar -xf - -C .pages-artifact
          test ! -e .pages-artifact/admin/.env
          test ! -e .pages-artifact/wrangler.jsonc

      - name: Deploy current static source to Cloudflare Pages
        run: npx --yes wrangler@4.124.0 pages deploy .pages-artifact --project-name=linx-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
