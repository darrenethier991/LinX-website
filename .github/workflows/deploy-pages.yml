name: Deploy LINX site to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy current main site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build allowlisted static Pages artifact
        run: |
          rm -rf .pages-artifact
          mkdir -p .pages-artifact/admin

          # Copy only pages and client assets that are intentionally public.
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '_headers' -o -name '_redirects' -o -name 'robots.txt' \) -exec cp {} .pages-artifact/ \;
          for directory in assets css js status status-assets white-label linxservices.ca; do
            if [ -d "$directory" ]; then
              cp -R "$directory" .pages-artifact/
            fi
          done
          find admin -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '_headers' -o -name '_redirects' \) -exec cp {} .pages-artifact/admin/ \;

          test -f .pages-artifact/index.html
          test -f .pages-artifact/admin/index.html
          test ! -e .pages-artifact/admin/.env
          test ! -e .pages-artifact/wrangler.jsonc
          test ! -e .pages-artifact/workers
          test ! -e .pages-artifact/package.json
          test ! -e .pages-artifact/admin/package.json
          test ! -e .pages-artifact/admin/server.js
          test ! -e .pages-artifact/.github

      - name: Deploy current static source to Cloudflare Pages
        run: npx --yes wrangler@4.124.0 pages deploy .pages-artifact --project-name=linx-website --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
