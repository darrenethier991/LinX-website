name: Deploy LINX API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy current main Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy current LINX API Worker
        run: npx --yes wrangler@4.124.0 deploy --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKER_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
