<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:26px; }
  .row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:18px; }
  .statbar { display:flex; border:1px solid var(--border-hairline); border-radius:14px; overflow:hidden; }
  .statbar > div { flex:1; padding:16px 12px; border-right:1px solid var(--border-hairline); }
  .statbar > div:last-child { border-right:none; }
  .cap { font-size:10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.14em; width:100%; margin-bottom:10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Badge, SectionLabel, StatItem } = window.LinXDesignSystem_1b8a1a;
  function Demo() {
    return (
      <div>
        <div className="cap">Badges &amp; section label</div>
        <div className="row">
          <Badge tone="success">Live</Badge>
          <Badge tone="info">New</Badge>
          <Badge tone="error">Hot</Badge>
          <Badge tone="gold">Featured</Badge>
          <Badge tone="muted">Draft</Badge>
          <SectionLabel style={{marginBottom:0, marginLeft:'12px'}}>Transparent Pricing</SectionLabel>
        </div>
        <div className="cap">Stats bar</div>
        <div className="statbar">
          <StatItem value="1,400+" label="Contractors" />
          <StatItem value="3,200+" label="Projects Posted" />
          <StatItem value="97%" label="Match Rate" />
          <StatItem value="4.9 ★" label="Avg Rating" />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
