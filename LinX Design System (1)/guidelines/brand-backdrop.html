<!-- @dsCard group="Brand" viewport="700x200" name="Backdrop" subtitle="Carbon-fiber weave with a soft gold sheen — matches the business card" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); color:var(--text-primary); }
  .stage { position:relative; height:200px; display:flex; align-items:center; justify-content:center;
    background: var(--linx-carbon);
    background-size: var(--linx-carbon-size);
  }
  .stage::after { content:''; position:absolute; inset:0; background:var(--linx-carbon-sheen); pointer-events:none; }
  .label { position:relative; text-align:center; z-index:1; }
  .label .t { font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:.16em; color:var(--text-accent); }
  .label .s { font-size:11px; color:var(--text-secondary); margin-top:6px; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="stage">
    <div class="label"><div class="t">Woven carbon, warm signal</div><div class="s">--linx-carbon weave · --linx-carbon-sheen gold vignette</div></div>
  </div>
</body>
</html>
