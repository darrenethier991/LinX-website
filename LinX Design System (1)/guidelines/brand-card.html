<!-- @dsCard group="Brand" viewport="700x180" name="Card Anatomy" subtitle="Dark card, hairline border → gold on hover; no drop shadow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .row { display:flex; gap:16px; }
  .card { flex:1; background:var(--surface-card); border:1px solid var(--border-hairline); border-radius:var(--radius-lg); padding:22px; transition:border-color var(--dur-base), transform var(--dur-base); }
  .card.hovered { border-color:var(--linx-gold); transform:translateY(-2px); }
  .icon { font-size:24px; }
  .h { font-size:16px; font-weight:800; margin:10px 0 6px; }
  .p { font-size:13px; color:var(--text-secondary); line-height:1.6; }
  .tag { position:absolute; top:8px; right:10px; font-size:9px; color:var(--linx-gold); text-transform:uppercase; letter-spacing:.14em; }
  .card { position:relative; }
</style>
</head>
<body>
  <div class="row">
    <div class="card"><span class="tag">Rest</span><div class="icon">🏡</div><div class="h">Homeowners</div><div class="p">Verified, local pros who care about their reputation.</div></div>
    <div class="card hovered"><span class="tag">Hover</span><div class="icon">🔨</div><div class="h">Contractors</div><div class="p">Qualified leads delivered daily — no bidding wars.</div></div>
  </div>
</body>
</html>
