<!-- @dsCard group="Brand" viewport="700x150" name="Iconography" subtitle="Native emoji for trades & activity; ✓ for feature lists; ★ for ratings" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .set { display:flex; gap:16px; font-size:26px; }
  .cap { font-size:10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.12em; margin:14px 0 8px; }
  .check li { list-style:none; font-size:13px; color:var(--text-secondary); display:flex; align-items:center; gap:8px; }
  .check li::before { content:'✓'; color:var(--linx-gold); font-weight:700; }
  ul { margin:0; padding:0; }
  .stars { color:var(--linx-gold); font-size:14px; margin-left:auto; }
  .flex { display:flex; align-items:center; }
</style>
</head>
<body>
  <div class="flex"><div><div class="cap" style="margin-top:0">Trades & activity</div><div class="set">🏠 ⚡ 🔧 🚿 🌳 🏗️ 🔨 🏡</div></div><span class="stars">★★★★★</span></div>
  <div class="cap">Feature lists</div>
  <ul class="check"><li>Verified contractors only</li><li>Transparent quotes, no bidding wars</li></ul>
</body>
</html>
