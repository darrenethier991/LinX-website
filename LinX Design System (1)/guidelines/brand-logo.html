<!-- @dsCard group="Brand" viewport="700x180" name="Logo Lockups" subtitle="Metallic-foil wordmark, flat gold, and LX monogram on carbon" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; font-family:var(--font-sans); color:var(--text-primary); padding:28px 26px;
    background: var(--linx-carbon); background-size: var(--linx-carbon-size); }
  .row { display:flex; align-items:center; gap:40px; }
  .b { text-align:center; }
  /* Metallic foil — the card's chromed-gold logo look */
  .foil { font-size:44px; font-weight:900; letter-spacing:var(--ls-tightest);
    background:var(--linx-gold-foil); -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .wm { font-size:38px; font-weight:900; letter-spacing:var(--ls-tightest); }
  .wm .lin { color:var(--linx-gold); }
  .wm .x { color:var(--linx-white); }
  .mark { width:58px; height:58px; border-radius:16px; background:rgba(11,11,13,.7); border:1.5px solid var(--linx-gold);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:900;
    letter-spacing:-1px; background-clip:padding-box;
    color:transparent; }
  .mark span { background:var(--linx-gold-foil); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .cap { font-size:10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.12em; margin-top:12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="foil">LinX</div><div class="cap">Metallic foil — primary</div></div>
    <div class="b"><div class="wm"><span class="lin">Lin</span><span class="x">X</span></div><div class="cap">Flat gold / white</div></div>
    <div class="b"><div class="mark"><span>LX</span></div><div class="cap">Monogram</div></div>
  </div>
</body>
</html>
