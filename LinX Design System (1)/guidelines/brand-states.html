<!-- @dsCard group="Brand" viewport="700x160" name="States & Motion" subtitle="Hover fills gold; borders warm; counters & feeds animate in" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .grid { display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .btn { padding:9px 22px; border-radius:var(--radius-pill); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--linx-gold-85); background:#000; color:var(--linx-gold); }
  .btn.on { background:var(--linx-gold); color:#000; }
  .cap { display:block; font-size:9px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.1em; text-align:center; margin-top:6px; }
  .col { text-align:center; }
  .ring { width:40px;height:40px;border:2px solid var(--linx-gold-55);border-radius:50%;margin:0 auto; }
  .dot { display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--linx-success);text-transform:uppercase;letter-spacing:.16em; }
  .dot::before { content:'';width:8px;height:8px;background:var(--linx-success);border-radius:50%; }
</style>
</head>
<body>
  <div class="grid">
    <div class="col"><button class="btn">Post Free</button><span class="cap">Rest</span></div>
    <div class="col"><button class="btn on">Post Free</button><span class="cap">Hover · fill</span></div>
    <div class="col"><div class="ring"></div><span class="cap">Cursor ring</span></div>
    <div class="col"><span class="dot">Live</span><span class="cap">Pulse dot</span></div>
  </div>
</body>
</html>
