<!-- @dsCard group="Colors" viewport="700x150" name="Admin Theme (Slate + Sky)" subtitle="Internal-tools surface — a separate utilitarian palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--admin-bg); font-family:var(--font-sans); color:var(--admin-text-primary); padding:20px 24px; }
  .row { display:flex; gap:12px; }
  .sw { flex:1; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--admin-border); }
  .chip { height:60px; }
  .meta { padding:7px 10px; background:var(--admin-surface); }
  .name { font-size:12px; font-weight:600; }
  .hex { font-size:10px; color:var(--admin-text-secondary); text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--admin-bg)"></div><div class="meta"><div class="name">BG · slate-950</div><div class="hex">#020617</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--admin-surface)"></div><div class="meta"><div class="name">Surface</div><div class="hex">#0F172A</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--admin-surface-soft)"></div><div class="meta"><div class="name">Soft</div><div class="hex">#1E293B</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--admin-accent)"></div><div class="meta"><div class="name">Accent · sky-400</div><div class="hex">#38BDF8</div></div></div>
  </div>
</body>
</html>
