<!-- @dsCard group="Colors" viewport="700x150" name="Brand Gold" subtitle="The single accent — warm gold on black" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:20px 24px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .sw { flex:1; min-width:120px; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-hairline); }
  .chip { height:64px; }
  .meta { padding:8px 10px; background:var(--surface-card); }
  .name { font-size:12px; font-weight:600; letter-spacing:.04em; }
  .hex { font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
  .tints { display:flex; gap:8px; margin-top:14px; }
  .tint { flex:1; height:22px; border-radius:6px; border:1px solid var(--border-hairline); display:flex; align-items:center; padding-left:8px; font-size:10px; color:var(--text-secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--linx-gold-dark)"></div><div class="meta"><div class="name">Gold Dark</div><div class="hex">#9C6F27</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--linx-gold)"></div><div class="meta"><div class="name">Gold — Primary</div><div class="hex">#DFB24E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--linx-gold-light)"></div><div class="meta"><div class="name">Gold Light</div><div class="hex">#F6DE8B</div></div></div>
  </div>
  <div class="tints">
    <div class="tint" style="background:var(--linx-gold-12)">12% · tint fill</div>
    <div class="tint" style="background:var(--linx-gold-35)">35% · subtle border</div>
    <div class="tint" style="background:var(--linx-gold-55)">55% · rings</div>
    <div class="tint" style="background:var(--linx-gold-85)">85% · strong border</div>
  </div>
</body>
</html>
