<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="True-black foundation, raised surfaces, hairline borders" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:20px 24px; }
  .row { display:flex; gap:12px; }
  .sw { flex:1; border-radius:var(--radius-md); overflow:hidden; border:1px solid var(--border-hairline); }
  .chip { height:70px; }
  .meta { padding:8px 10px; background:#000; }
  .name { font-size:12px; font-weight:600; }
  .hex { font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.08em; margin-top:2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--linx-black)"></div><div class="meta"><div class="name">Page Black</div><div class="hex">#000000</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--linx-bg-surface)"></div><div class="meta"><div class="name">Surface</div><div class="hex">#050506</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--linx-bg-card)"></div><div class="meta"><div class="name">Card</div><div class="hex">#0B0B0D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--linx-border)"></div><div class="meta"><div class="name">Border</div><div class="hex">#1E1E22</div></div></div>
  </div>
</body>
</html>
