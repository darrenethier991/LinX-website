<!-- @dsCard group="Colors" viewport="700x140" name="Semantic Status" subtitle="Success, error, info — always shown as 12% tinted pills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 24px; }
  .row { display:flex; gap:16px; }
  .item { flex:1; }
  .badge { display:inline-block; padding:4px 12px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
  .b-success { background:var(--linx-success-12); color:var(--linx-success); }
  .b-error { background:var(--linx-error-12); color:var(--linx-error); }
  .b-info { background:var(--linx-info-12); color:var(--linx-info); }
  .swatch { height:8px; border-radius:4px; margin:12px 0 6px; }
  .hex { font-size:11px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.08em; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="badge b-success">Live</span><div class="swatch" style="background:var(--linx-success)"></div><div class="hex">Success · #22C55E</div></div>
    <div class="item"><span class="badge b-error">Hot</span><div class="swatch" style="background:var(--linx-error)"></div><div class="hex">Error · #EF4444</div></div>
    <div class="item"><span class="badge b-info">New</span><div class="swatch" style="background:var(--linx-info)"></div><div class="hex">Info · #3B82F6</div></div>
  </div>
</body>
</html>
