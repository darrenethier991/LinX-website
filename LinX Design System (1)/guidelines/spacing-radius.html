<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="8 · 12 · 14 for cards; 999 for every pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .row { display:flex; gap:18px; align-items:center; }
  .b { text-align:center; }
  .box { width:72px; height:56px; background:var(--surface-card); border:1px solid var(--linx-gold-35); }
  .lbl { font-size:11px; color:var(--text-secondary); margin-top:8px; letter-spacing:.04em; }
  .pill { width:120px; height:38px; border-radius:var(--radius-pill); background:var(--linx-gold); }
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="lbl">8 · sm</div></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-md)"></div><div class="lbl">12 · md</div></div>
    <div class="b"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lbl">14 · lg</div></div>
    <div class="b"><div class="pill"></div><div class="lbl">999 · pill</div></div>
  </div>
</body>
</html>
