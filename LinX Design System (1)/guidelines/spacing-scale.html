<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4 → 72px rhythm; sections breathe at 72" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .b { text-align:center; }
  .bar { background:var(--linx-gold-35); border-top:2px solid var(--linx-gold); }
  .lbl { font-size:10px; color:var(--text-secondary); margin-top:6px; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="row">
    <div class="b"><div class="bar" style="width:4px;height:4px"></div><div class="lbl">4</div></div>
    <div class="b"><div class="bar" style="width:8px;height:8px"></div><div class="lbl">8</div></div>
    <div class="b"><div class="bar" style="width:12px;height:12px"></div><div class="lbl">12</div></div>
    <div class="b"><div class="bar" style="width:14px;height:14px"></div><div class="lbl">14</div></div>
    <div class="b"><div class="bar" style="width:22px;height:22px"></div><div class="lbl">22</div></div>
    <div class="b"><div class="bar" style="width:28px;height:28px"></div><div class="lbl">28</div></div>
    <div class="b"><div class="bar" style="width:40px;height:40px"></div><div class="lbl">40</div></div>
    <div class="b"><div class="bar" style="width:52px;height:52px"></div><div class="lbl">52</div></div>
    <div class="b"><div class="bar" style="width:72px;height:72px"></div><div class="lbl">72 · section</div></div>
  </div>
</body>
</html>
