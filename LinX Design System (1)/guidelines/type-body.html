<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .lead { font-size:var(--fs-body-lg); color:var(--text-secondary); line-height:var(--lh-relaxed); max-width:560px; }
  .body { font-size:var(--fs-body); color:var(--text-primary); line-height:var(--lh-body); margin-top:10px; }
  .meta { font-size:var(--fs-body-sm); color:var(--text-secondary); margin-top:10px; }
  .spec { font-size:11px; color:var(--text-secondary); margin-top:6px; letter-spacing:.04em; opacity:.7; }
</style>
</head>
<body>
  <p class="lead">Quiet automation for busy teams. SMS, CRM, and AI agents that just work.</p>
  <p class="body">From posting a project to shaking hands on a quote — LinX makes every step effortless.</p>
  <p class="meta">Toronto, ON · CAD $22k–$30k · 2h ago</p>
  <div class="spec">Lead 15px muted · Body 14px · Meta 13px muted</div>
</body>
</html>
