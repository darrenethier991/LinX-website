<!-- @dsCard group="Type" viewport="700x180" name="Display & Headings" subtitle="Inter — tight, heavy, uppercase hero" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; }
  .eyebrow { font-size:var(--fs-eyebrow); font-weight:600; letter-spacing:var(--ls-eyebrow); text-transform:uppercase; color:var(--text-accent); margin-bottom:8px; }
  .hero { font-size:44px; font-weight:800; letter-spacing:var(--ls-wider); text-transform:uppercase; line-height:1.1; }
  .hero em { color:var(--text-accent); font-style:normal; }
  .title { font-size:var(--fs-title); font-weight:800; margin-top:14px; }
  .spec { font-size:11px; color:var(--text-secondary); margin-top:4px; letter-spacing:.04em; }
</style>
</head>
<body>
  <div class="eyebrow">Simple Process</div>
  <div class="hero"><em>Lin</em>X</div>
  <div class="spec">Hero · 800 · UPPERCASE · tracking .12em</div>
  <div class="title">How LinX Works</div>
  <div class="spec">Section title · 32px · 800</div>
</body>
</html>
