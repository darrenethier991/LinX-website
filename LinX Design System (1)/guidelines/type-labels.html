<!-- @dsCard group="Type" viewport="700x150" name="Labels & Tracking" subtitle="The LinX signature — UPPERCASE with wide letter-spacing" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:22px 26px; display:flex; flex-direction:column; gap:14px; }
  .stack { display:flex; align-items:baseline; gap:16px; }
  .lbl { text-transform:uppercase; font-weight:600; }
  .l-eyebrow { font-size:11px; letter-spacing:.24em; color:var(--text-accent); }
  .l-nav { font-size:12px; letter-spacing:.12em; color:var(--text-secondary); }
  .l-stat { font-size:11px; letter-spacing:.16em; color:var(--text-secondary); }
  .l-badge { font-size:10px; letter-spacing:.08em; font-weight:700; }
  .spec { font-size:11px; color:var(--text-secondary); opacity:.6; margin-left:auto; }
</style>
</head>
<body>
  <div class="stack"><span class="lbl l-eyebrow">Transparent Pricing</span><span class="spec">Eyebrow · 11 · .24em · gold</span></div>
  <div class="stack"><span class="lbl l-nav">How It Works</span><span class="spec">Nav · 12 · .12em</span></div>
  <div class="stack"><span class="lbl l-stat">Match Rate</span><span class="spec">Stat label · 11 · .16em</span></div>
  <div class="stack"><span class="lbl l-badge" style="color:var(--linx-success)">Live</span><span class="spec">Badge · 10 · .08em · 700</span></div>
</body>
</html>
