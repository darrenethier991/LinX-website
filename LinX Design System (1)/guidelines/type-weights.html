<!-- @dsCard group="Type" viewport="700x150" name="Weight Scale" subtitle="Inter 300 → 900 · headings use 800–900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; background:var(--surface-page); font-family:var(--font-sans); color:var(--text-primary); padding:20px 26px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 22px; }
  .w { font-size:26px; line-height:1.3; }
  .w span { display:block; font-size:10px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:.1em; margin-top:-2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="w" style="font-weight:300">Aa<span>300 Light</span></div>
    <div class="w" style="font-weight:400">Aa<span>400 Regular</span></div>
    <div class="w" style="font-weight:500">Aa<span>500 Medium</span></div>
    <div class="w" style="font-weight:600">Aa<span>600 Semibold</span></div>
    <div class="w" style="font-weight:700">Aa<span>700 Bold</span></div>
    <div class="w" style="font-weight:800;color:var(--text-accent)">Aa<span>800 Extrabold</span></div>
    <div class="w" style="font-weight:900;color:var(--text-accent)">Aa<span>900 Black</span></div>
  </div>
</body>
</html>
