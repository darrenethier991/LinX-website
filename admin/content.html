<!doctype html>
<html lang="en-CA">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>Content Controls — LINX Services Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /><link rel="stylesheet" href="../css/linx-design-system.css" /><style>.content{padding:48px 0}.editor{max-width:780px}.note{margin-top:12px;font-size:12px;color:var(--text-muted);line-height:1.65}</style></head>
<body><nav class="nav"><a class="nav__logo" href="../index.html"><span class="l">Lin</span><span class="x">X</span></a><ul class="nav__links"><li><a href="index.html">Dashboard</a></li><li><a href="users.html">Users & Access</a></li><li><a href="analytics.html">Analytics</a></li></ul></nav><main class="content"><div class="container editor"><span class="eyebrow">Administrator</span><h1 class="section-title">Homepage content controls</h1><p class="section-sub" style="margin-bottom:24px">Update the primary LINX Services headline and supporting text. Changes are constrained to plain text and appear on the homepage after the API is deployed.</p><form id="content-form" class="card"><div class="form-group"><label class="form-label" for="headline">Hero headline</label><input class="form-input" id="headline" maxlength="180" required /></div><div class="form-group"><label class="form-label" for="subhead">Hero supporting text</label><textarea class="form-input form-textarea" id="subhead" maxlength="340" required></textarea></div><button class="btn btn--primary" type="submit">Save content</button><p class="note" id="message" role="status"></p></form></div></main><script>const API_BASE=window.LINX_API_BASE||"https://api.linxservices.ca";const token=localStorage.getItem("linx_token")||sessionStorage.getItem("linx_token")||"";const message=document.getElementById("message");async function load(){const response=await fetch(`${API_BASE}/api/admin/content`,{headers:{Authorization:`Bearer ${token}`}});const data=await response.json();if(!response.ok){message.textContent=data.error||"Administrator access is required.";message.style.color="#fecaca";return;}document.getElementById("headline").value=data.content.hero_headline||"LINX";document.getElementById("subhead").value=data.content.hero_subhead||"Quiet automation for busy trades. SMS, CRM, AI agents, and a marketplace that earns while you work.";}document.getElementById("content-form").addEventListener("submit",async event=>{event.preventDefault();message.textContent="";const response=await fetch(`${API_BASE}/api/admin/content`,{method:"PUT",headers:{"Content-Type":"application/json",Authorization:`Bearer ${token}`},body:JSON.stringify({hero_headline:document.getElementById("headline").value,hero_subhead:document.getElementById("subhead").value})});const data=await response.json();message.textContent=response.ok?"Saved. The homepage will use the updated text once the Worker is deployed.":(data.error||"Unable to save content.");message.style.color=response.ok?"#86efac":"#fecaca";});load();</script></body>
</html>
