<!doctype html>

<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" /><title>Subscriber Access — LINX Services</title>

  <meta property="og:type" content="website"/>

  <meta name="twitter:card" content="summary_large_image"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" /><link rel="stylesheet" href="css/linx-design-system.css" /><style>.access{min-height:calc(100vh - var(--nav-h));display:grid;place-items:center;padding:40px 0;background:radial-gradient(circle at 50% 0%,rgba(212,168,83,.14),transparent 35%),var(--bg-deep)}.access .card{width:min(100%,430px)}.help{font-size:12px;color:var(--text-muted);line-height:1.65;margin:14px 0 22px}</style></head>
<body><nav class="nav"><a class="nav__logo" href="index.html"><span class="l">Lin</span><span class="x">X</span></a><div class="nav__actions"><a class="btn btn--ghost btn--sm" href="clam-code.html">Clam Code</a></div></nav><main class="access"><section class="card"><span class="eyebrow">Subscriber access</span><h1 class="section-title">Open your LINX workspace</h1><p class="help">Enter the email and one-time access code supplied by a LINX administrator. The code can be used once and is not retained in readable form.</p><form id="access-form"><div class="form-group"><label class="form-label">Email</label><input class="form-input" id="email" type="email" required /></div><div class="form-group"><label class="form-label">Access code</label><input class="form-input" id="code" autocomplete="one-time-code" required /></div><button class="btn btn--primary btn--full" type="submit">Continue</button><p class="help" id="message" role="alert"></p></form></section></main><script>const API_BASE=window.LINX_API_BASE||"https://api.linxservices.ca";document.getElementById("access-form").addEventListener("submit",async event=>{event.preventDefault();const message=document.getElementById("message");message.textContent="";const response=await fetch(`${API_BASE}/api/auth/access`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,code:document.getElementById("code").value})});const data=await response.json();if(!response.ok){message.textContent=data.error||"Unable to continue.";message.style.color="#fecaca";return;}localStorage.setItem("linx_token",data.token);location.href="subscriber-workspace.html";});</script></body>
</html>
